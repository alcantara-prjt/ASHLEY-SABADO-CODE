<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | EduWorkshop</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-leaf"></i> EduWorkshop
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="ethics.html">Privacy Statement</a></li>
            <li><a href="contract.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="page">
    <div class="page-box">

        <h1>
            <i class="fa-solid fa-envelope"></i>
            Contact Us
        </h1>

        <p>
            Have a question or want to participate in the educational
            workshop? Send us a message below.
        </p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn">
                Send Message
                <i class="fa-solid fa-paper-plane"></i>
            </button>

        </form>

    </div>
</main>

<footer>
    <p>&copy; 2026 EduWorkshop. Educational community project.</p>
</footer>

</body>
</html>
